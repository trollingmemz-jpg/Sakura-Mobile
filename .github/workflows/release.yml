name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build and verify signed APK
        env:
          SAKURA_KEYSTORE_BASE64: ${{ secrets.SAKURA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          export SAKURA_SIGNING_KEYSTORE="$RUNNER_TEMP/sakura-signing.keystore"
          trap 'rm -f "$SAKURA_SIGNING_KEYSTORE"' EXIT
          test -n "$SAKURA_KEYSTORE_BASE64"
          printf '%s' "$SAKURA_KEYSTORE_BASE64" | base64 --decode > "$SAKURA_SIGNING_KEYSTORE"
          unset SAKURA_KEYSTORE_BASE64
          ./gradlew --no-daemon :app:lintDebug :app:assembleRelease
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          fingerprint=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$fingerprint" = 36093bee6cc49ca593058bc017f893cbf9c203e931f16f2d544d7ed5c2dbf9c8
          package=$("$tools/aapt" dump badging "$apk" | sed -n "/^package:/p")
          [[ "$package" == "package: name='dev.sakura.mobile'"* ]]
          code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$package")
          version=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package")
          test -n "$code"
          test "$RELEASE_TAG" = "v$version"
          cp "$apk" "sakura-mobile-$code.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" sakura-mobile-*.apk --verify-tag --generate-notes
